<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FrigoPlan - Gestor Familiar</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#2e7d32">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="logo-container">
            <span class="logo-icon">🥗</span>
            <h1>FrigoPlan</h1>
        </div>
        <button onclick="resetApp()" class="btn btn-sm btn-danger" style="margin-top: 10px; background: rgba(0,0,0,0.2);">🔄 Resetear Datos</button>
    </header>

    <main class="container">
        <div class="main-dashboard-grid">
            <section class="daily-summary-card">
                <div class="section-action-header">
                    <h2>🍴 Menú del Día</h2>
                    <button type="button" class="btn btn-primary btn-sm" onclick="openAddRecipeModal()">📖 Añadir Receta</button>
                </div>
                <div class="daily-grid">
                    <div class="day-summary-box today-box">
                        <span class="badge-day">HOY</span>
                        <div class="summary-details">
                            <div class="clickable-dish-row" onclick="openMainChangeModal('comida')">
                                <span>☀️ <strong>Comida:</strong> <span id="today-lunch"></span></span>
                                <button type="button" class="btn-edit-inline">✏️</button>
                            </div>
                            <div class="clickable-dish-row" onclick="openMainChangeModal('cena')">
                                <span>🌙 <strong>Cena:</strong> <span id="today-dinner"></span></span>
                                <button type="button" class="btn-edit-inline">✏️</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="daily-summary-card shopping-preview-card">
                <div class="section-action-header">
                    <h2>🛒 Compra Rápida</h2>
                </div>
                <form onsubmit="addShoppingItem(event)" class="add-shopping-bar-mini">
                    <input type="text" id="shopping-input-main" placeholder="Añadir producto..." required>
                    <button type="submit" class="btn btn-primary btn-sm">➕</button>
                </form>
                <div id="shopping-list-main-preview" class="shopping-preview-list"></div>
            </section>
        </div>

        <nav class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('freezer')">🧊 Congelador</button>
            <button class="tab-btn" onclick="switchTab('planner')">📅 Plan Semanal</button>
            <button class="tab-btn" onclick="switchTab('recipes')">📖 Recetas</button>
            <button class="tab-btn" onclick="switchTab('shopping')">🛒 Compra</button>
        </nav>

        <section id="tab-freezer" class="tab-content active">
            <div class="section-action-header">
                <h2>Alimentos en Congelador</h2>
                <button class="btn btn-primary" onclick="openAddModal()">➕ Añadir Guiso</button>
            </div>
            <div id="stock-grid" class="cards-grid"></div>
            <div id="empty-stock-msg" class="empty-state hidden"><h3>El congelador está vacío</h3></div>
        </section>

        <section id="tab-planner" class="tab-content">
            <h2>Planificador Semanal</h2>
            <div id="week-planner-container" class="planner-days"></div>
        </section>

        <section id="tab-recipes" class="tab-content">
            <div class="section-action-header">
                <h2>Catálogo de Recetas</h2>
                <button class="btn btn-primary" onclick="openAddRecipeModal()">➕ Nueva Receta</button>
            </div>
            <div id="recipes-list" class="cards-grid"></div>
        </section>

        <section id="tab-shopping" class="tab-content">
            <div class="section-action-header">
                <h2>🛒 Lista Completa</h2>
                <button class="btn btn-danger" onclick="deleteSelectedShoppingItems()">🗑️ Borrar marcados</button>
            </div>
            <form onsubmit="addShoppingItem(event)" class="add-shopping-bar-mini" style="margin-bottom:16px;">
                <input type="text" id="shopping-input-tab" placeholder="Añadir producto..." required>
                <button type="submit" class="btn btn-primary">➕</button>
            </form>
            <div id="shopping-list-container" class="shopping-list-grid"></div>
        </section>
    </main>

    <!-- Modals (Simplified for robustness) -->
    <div id="plan-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Seleccionar Alimento</h3><span class="close-btn" onclick="closeModals()">&times;</span></div>
            <form onsubmit="savePlannerChoice(event)">
                <input type="hidden" id="plan-day">
                <input type="hidden" id="plan-type">
                <div class="form-group"><select id="plan-dish-select" required></select></div>
                <button type="submit" class="btn btn-primary" style="width:100%">Guardar</button>
            </form>
        </div>
    </div>

    <div id="add-recipe-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>📖 Nueva Receta</h3><span class="close-btn" onclick="closeModals()">&times;</span></div>
            <form onsubmit="saveRecipeForm(event)">
                <div class="form-group"><input type="text" id="recipe-name" placeholder="Nombre" required></div>
                <div class="form-group">
                    <select id="recipe-category" required>
                        <option value="Comida">Comida</option><option value="Cena">Cena</option>
                    </select>
                </div>
                <div class="form-group"><label><input type="checkbox" id="recipe-freezable"> ¿Es congelable?</label></div>
                <button type="submit" class="btn btn-primary" style="width:100%">Guardar</button>
            </form>
        </div>
    </div>

    <div id="add-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>🍲 Añadir al Congelador</h3><span class="close-btn" onclick="closeModals()">&times;</span></div>
            <form onsubmit="saveStockForm(event)">
                <div class="form-group"><select id="dish-name" required></select></div>
                <div class="form-group"><input type="number" id="dish-servings" placeholder="Nº de raciones" min="1" value="4" required></div>
                <button type="submit" class="btn btn-primary" style="width:100%">Añadir</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
